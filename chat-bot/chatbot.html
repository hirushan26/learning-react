<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <div class="js-container"></div>

    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>
    <script src="https://unpkg.com/supersimpledev/chatbot.js"></script>
    <script src="https://unpkg.com/supersimpledev/babel.js"></script>


    <script type="text/babel">
      function ChatInput({chatMessages,setChatMessages}){
        const [inputText, setInputText] = React.useState('');

        function saveInputText(event){
          setInputText(event.target.value);  //event.target.value get what ever we are typing inside
        }

        function sendMessage(){
          const newMessages = [
            ...chatMessages,
            {message:inputText, sender:'user', id: crypto.randomUUID()}
          ]
          setChatMessages(newMessages);

          const response = Chatbot.getResponse(inputText);
          setChatMessages([
              ...newMessages,
              {message:response, sender:'robot', id: crypto.randomUUID()}
            ]);

          setInputText('');
        }

        return (
          <>
            <input type="text" placeholder="Send a message to chatbot" size="30" onChange={saveInputText} value={inputText}/>
            <button onClick={sendMessage}>Send</button>
          </>
          
        );
      }

      function ChatMessage({message, sender}) {
        //const {message, sender} =  props;
        
        /*
        if (sender === 'robot'){
          return (
            <div>
              <img src = "/images/robot.png" width = "50" />
              {message}
            </div>
          );
        }
        */
        return (
          <div>
            {sender === 'robot' && <img src = "/images/robot.png" width = "50" />}
            {message}
            {sender === 'user' && <img src = "/images/user.png" width = "50" />}
          </div>
        );
        
      }

      function ChatMessages({chatMessages}){
        return(
          <>
            {chatMessages.map((chatMessage) => {
              return (
                <ChatMessage message={chatMessage.message} sender={chatMessage.sender} key={chatMessage.id} />
              );
            })}
          </>
        );
      }

      function App() {
        //Lifted th state up to the App component so ChatInput and ChatMessages can access it.
        const [chatMessages,setChatMessages] = React.useState([
          {message:'Hello chatbot!', sender:'user', id:'id1'},
          {message:'Hello how can I help you?', sender:'robot', id:'id2'},
          {message:'Can you get me todays date?', sender:'user', id:'id3'},
          {message:'Today is August 13', sender:'robot', id:'id4'},
          ]
        );
        //const [chatMessages,setChatMessages] = array;
        //const chatMessages = array[0];
        //const setChatMessages = array[1];
        return (
          <>
          <ChatInput chatMessages={chatMessages} setChatMessages={setChatMessages}/>
          <ChatMessages chatMessages={chatMessages}/>
          </>
        );
      }

      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
